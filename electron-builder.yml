# electron-builder 配置。
#
# 只产出免安装的 Windows 便携版单文件 exe（不生成安装程序）。
# 产物落在 release/ 下，已在 .gitignore 中忽略。
#
# 注意：这里的 productName 必须与 package.json 保持一致 —— Electron 用
# productName 推导 app.getName()，进而决定 userData 目录。

appId: com.tyme.app
productName: 万年历

directories:
  buildResources: build
  output: release

# 主进程与 preload 的产物已由 electron-vite 打到 out/，而且只 require
# `electron` 与 `node:` 内置模块（其余依赖全部被打进 bundle），渲染层的依赖
# 也同样在 bundle 里。因此包里只需要 out/ 与 package.json。
#
# `!node_modules/**` 是这个前提的兑现：electron-builder 默认会把
# dependencies 一起塞进 asar，多出约 9 MB 永远不会被 require 的文件。
# 代价是主进程 / preload 不能从 dependencies 里导入任何包 —— 否则
# electron-vite 的 externalizeDepsPlugin 会把它变成运行时 require。
# 这条约束由 tests/packaging-contract.test.ts 守着。
files:
  - '!**/.vscode/*'
  - '!node_modules/**'
  - '!src/**'
  - '!tests/**'
  - '!scripts/**'
  - '!assets/**'
  - '!vendor/**'
  - '!release/**'
  - '!docs/**'
  - '!.github/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!eslint.config.mjs'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.gitignore,.gitattributes,.gitmodules,.editorconfig,.prettierignore,.prettierrc.json,.eslintcache}'
  - '!{README.md,package-lock.json}'

# 项目没有原生模块，跳过重建可以显著加快打包。
npmRebuild: false

win:
  # electron-builder 会把 SVG 光栅化成多尺寸 .ico 再写入 exe。
  # 来源与署名见 assets/calendar-author.txt 与 docs/licensing.md。
  icon: assets/calendar.svg
  target:
    - target: portable
      arch:
        - x64

portable:
  # 产物文件名保持 ASCII：中文名上传到 GitHub Release 后汉字会丢，变成
  # 「-0.1.1-portable.exe」这种残名。应用名（productName）仍是「万年历」，
  # 这里只影响 exe 的文件名。
  artifactName: chinese-calendar-${version}-portable.${ext}
