name: Release

# 唯一的发版入口：推一个 v* tag。用 `npm run release:patch|minor|major` 一步完成
# 升版本号、提交、打附注标签和推送。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows 便携版
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Rust 已经装在 windows-latest 镜像里，这里只固定工具链版本，
      # 免得某次镜像更新把 MSVC 换掉之后构建行为跟着变。
      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装依赖
        run: npm ci

      # 下载的 crate 与索引：命中后省掉几分钟的解析与下载。target/ 不缓存——
      # 增量构建的失效条件（features、profile、依赖版本）在 Windows 上很难对齐，
      # 缓存错一次的代价比重新编译一次大。
      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/cargo/registry
            ~/AppData/Local/cargo/index
            ~/.cargo/registry
            ~/.cargo/index
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 发布的产物必须自己证明它来自一个测试通过的提交，不能依赖发版前在本地跑过什么。
      - name: 静态检查与单元测试
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
        shell: bash

      # 工作目录必须是 src-tauri：`cargo fmt` 从当前目录往上找 Cargo.toml，在仓库根目录上
      # 它找不到（CI 第一次就栽在这行）。`cargo check` 之前靠 --manifest-path 绕过了同一个问题，
      # 现在两条命令统一在 crate 目录里跑。
      - name: Rust 格式与检查
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo check --all-targets
        shell: bash

      # 版本号只写在 package.json 里，tag 必须与它一致，否则产物文件名会和
      # Release 标题对不上。
      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag 与 package.json 的 $pkg 不一致：请用 npm run release:patch 发版"
          }
          Write-Host "版本一致：$pkg"

      - name: 打包便携版
        run: npm run package

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tyme-app-portable-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          # artifact 是不可变的：同一个 tag 重跑一次会因为同名而失败，这里允许覆盖。
          overwrite: true

      # 建成 draft，人工确认 exe 能跑之后再在 Releases 页面点 Publish。
      # 重复推送同一个 tag 时会走 upload --clobber，不会报「已存在」。
      - name: 创建或更新 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 原生命令的非零退出码不直接终止脚本，下面逐条检查 $LASTEXITCODE。
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ github.ref_name }}'
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw '未找到 release/*.exe' }

          # 摘要：用户最关心的是"这个 exe 有多大"，旧版是 90+ MB 的自解压包。
          $size = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "产物 $($exe.Name)：$size MB"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传资产"
            gh release upload $tag $exe.FullName --clobber
          } else {
            gh release create $tag $exe.FullName --title $tag --generate-notes --draft
          }
          if ($LASTEXITCODE -ne 0) { throw "gh 发布失败（退出码 $LASTEXITCODE）" }
