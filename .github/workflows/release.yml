name: Release

# 唯一的发版入口：推一个 v* tag。用 `npm run release:patch|minor|major` 一步完成
# 升版本号、提交、打附注标签和推送。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows 便携版
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发布的产物必须自己证明它来自一个测试通过的提交，不能依赖发版前在本地跑过什么。
      - name: 单元测试
        run: npm test

      # Electron 发行包（约 120 MB）和 electron-builder 自己下载的打包工具
      # （nsis / winCodeSign / 7zip）都在 %LOCALAPPDATA% 下，缓存之后后续构建
      # 只剩解包时间。
      - name: 缓存 electron 与打包工具
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # 版本号只写在 package.json 里，tag 必须与它一致，否则产物文件名会和
      # Release 标题对不上。
      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag 与 package.json 的 $pkg 不一致：请用 npm run release:patch 发版"
          }
          Write-Host "版本一致：$pkg"

      - name: 打包便携版
        run: npm run package

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tyme-app-portable-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          # artifact 是不可变的：同一个 tag 重跑一次会因为同名而失败，这里允许覆盖。
          overwrite: true

      # 建成 draft，人工确认 exe 能跑之后再在 Releases 页面点 Publish。
      # 重复推送同一个 tag 时会走 upload --clobber，不会报「已存在」。
      - name: 创建或更新 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 原生命令的非零退出码不直接终止脚本，下面逐条检查 $LASTEXITCODE。
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ github.ref_name }}'
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw '未找到 release/*.exe' }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传资产"
            gh release upload $tag $exe.FullName --clobber
          } else {
            gh release create $tag $exe.FullName --title $tag --generate-notes --draft
          }
          if ($LASTEXITCODE -ne 0) { throw "gh 发布失败（退出码 $LASTEXITCODE）" }
