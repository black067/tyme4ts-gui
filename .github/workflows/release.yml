name: Release

on:
  push:
    tags: ['v*']
  # 手动触发只出 artifact、不发版：这样不依赖本地 Windows 环境也能拿到便携版 exe。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows 便携版
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发版前再跑一次单测：标签可能打在没走过 CI 的提交上。
      - name: 单元测试
        run: npm test

      # Electron 发行包（约 120 MB）和 electron-builder 自己下载的打包工具
      # （nsis / winCodeSign / 7zip）都在 %LOCALAPPDATA% 下，缓存之后后续构建
      # 只剩解包时间。
      - name: 缓存 electron 与打包工具
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # 版本号只写在 package.json 里，tag 必须与它一致，否则产物文件名会和
      # Release 标题对不上。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag 与 package.json 的 $pkg 不一致：请用 npm run release:patch 发版"
          }
          Write-Host "版本一致：$pkg"

      - name: 打包便携版
        run: npm run package

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyme-app-portable-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error

      - name: 创建或更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 原生命令的非零退出码不直接终止脚本，下面逐条检查 $LASTEXITCODE。
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ github.ref_name }}'
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw '未找到 release/*.exe' }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传资产"
            gh release upload $tag $exe.FullName --clobber
          } else {
            gh release create $tag $exe.FullName --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh 发布失败（退出码 $LASTEXITCODE）" }
